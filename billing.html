<!DOCTYPE html>
<html>
<head>
  <title>Billing</title>

  <style>

  /* =========================
     PAGE BACKGROUND
  ========================= */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #fff;
  }

  /* =========================
     PAGE LAYOUT
  ========================= */
  .page-container {
    min-height: 100vh;
    padding: 40px 20px;
    position: relative;
  }

  /* =========================
     BILLING CARD (SIDE INFO)
  ========================= */
  .billing-card {
    position: absolute;
    top: 40px;
    left: 40px;

    background: #ffffff;
    color: #111;
    padding: 20px;
    border-radius: 12px;
    width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .billing-card h1 {
    margin-bottom: 10px;
  }

  .billing-card p {
    color: #555;
    font-size: 14px;
  }

  /* =========================
     POPUP BACKDROP
  ========================= */
  .popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.75);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
  }

  /* POPUP HEADER */
.popup-header {
  margin-bottom: 20px;
  padding-bottom: 15px;
  border-bottom: 1px solid #e5e7eb;
}

.popup-header h1 {
  margin: 0;
  font-size: 22px;
  color: #111;
}

.popup-header p {
  margin-top: 6px;
  font-size: 14px;
  color: #666;
}

  /* =========================
     POPUP CARD
  ========================= */
  .popup-card {
    background: #ffffff;
    padding: 28px;
    border-radius: 14px;
    width: 340px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    max-height: 90vh;
    overflow-y: auto;
    animation: fadeIn 0.25s ease;
    scroll-behavior: smooth;
  }

  /* =========================
     TITLE
  ========================= */
  .popup-card h2 {
    margin-bottom: 18px;
    font-size: 20px;
    font-weight: 700;
    color: #111;
  }

  /* =========================
     PRICE BOX
  ========================= */
  .price-box {
    display: flex;
    justify-content: space-between;
    margin: 12px 0;
    padding: 12px;
    border-radius: 10px;
    background: #ff7a00;
  }

  /* SETUP FEE */

.setup-price {
  background: #0284c7;
  border: 1px solid #111;
}

/* MONTHLY FEE */

.monthly-price {
  background: #8000ff;
  border: 1px solid #111;
}


  .price-box.total {
    background: #00c853;
    border: 1px solid #f1f5f9;
    font-weight: bold;
  }

  .price-box.next {
    background: #8000ff;
    border: 1px solid #e0f2fe;
  }

  /* =========================
     LABEL
  ========================= */
  #itemType {
    margin-top: 12px;
    font-size: 13px;
    color: #444;
  }

  /* =========================
     BUTTONS
  ========================= */
  .actions {
    margin-top: 22px;
    display: flex;
    gap: 12px;
  }

  #continuePayment {
    flex: 1;
    background: #16a34a;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }

  #closePopup {
    flex: 1;
    background: #f1f5f9;
    border: none;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
  }

  /* =========================
   ANIMATION
========================= */
@keyframes fadeIn {
  from {
    transform: scale(0.95);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

  </style>
</head>

<body>


  <!-- POPUP -->
  <div id="billingPopup" class="popup">
    <div class="popup-card">

      <div class="popup-header">
  <h1>Billing Summary</h1>
  <p  id="billingSubtitle"></p>
</div>

      <h2 id="itemName"></h2>
      <p id="itemFullName"></p>
      <p id="itemType"></p>

      <div class="price-box setup-price">
        <p>Setup Fee</p>
        <h3 id="setupPrice"></h3>
      </div>

      <div class="price-box monthly-price"> 
        <p id="monthlyTitle">Monthly</p>
        <h3 id="monthlyPrice"></h3>
      </div>

      <div class="price-box total">
        <p>Total Today</p>
        <h2 id="totalToday"></h2>
      </div>

      <div class="price-box next">
        <p>Next Billing</p>
        <h3 id="monthlyNext"></h3>
      </div>

      <div class="actions">
        <button id="continuePayment">Proceed to Payment</button>
        <button id="closePopup">Close</button>
      </div>

    </div>
  </div>

  <!-- =========================
       JS
  ========================= -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {

    const params = new URLSearchParams(window.location.search);

const id = params.get("id");
const type = params.get("type");

if (!id || !type) {
  alert("Invalid item selected");
  return;
}

if (!["website", "system", "agent"].includes(type)) {
  alert("Invalid item type");
  return;
}


    // FETCH ITEM

let apiUrl = "";
let monthlyFee = 0;

if (type === "website") {
  apiUrl =
    "https://modular-infrastructure.onrender.com/api/websites/websites/" + id;
} else if (type === "agent") {
  apiUrl =
    "https://modular-infrastructure.onrender.com/api/agents/" + id;
} else if (type === "system") {
  apiUrl =
    "https://modular-infrastructure.onrender.com/api/systems/" + id;
}

fetch(apiUrl)
  .then(res => res.json())
  .then(data => {

    // Dynamic popup header
    document.querySelector(".popup-header p").innerText =
      type === "website"
        ? "Review your website before payment"
        : type === "agent"
        ? "Review your agent before payment"
        : "Review your system before payment";

    // Dynamic monthly title
    document.getElementById("monthlyTitle").innerText =
      type === "website"
        ? "Current Service Fee"
        : "Monthly";

    // Name
    document.getElementById("itemName").innerText =
      data.name || "";

    // Full Name
    document.getElementById("itemFullName").innerText =
      data.full_name || "";

    // Type
    document.getElementById("itemType").innerText =
      `Type: ${
        data.type.charAt(0).toUpperCase() +
        data.type.slice(1)
      }`;

    // Setup Fee
    document.getElementById("setupPrice").innerText =
      "$" + data.setup_fee;

    // Monthly Fee
    monthlyFee =
      type === "website"
        ? data.basic_monthly_fee
        : data.monthly_fee;

    document.getElementById("monthlyPrice").innerText =
      "$" + monthlyFee;

    // Total Today
    document.getElementById("totalToday").innerText =
      "$" + (
        Number(data.setup_fee) +
        Number(monthlyFee)
      );

    // Next Billing
    document.getElementById("monthlyNext").innerText =
      "$" + monthlyFee + "/month";

    // Open popup
    document.getElementById("billingPopup").style.display =
      "flex";
  })
  .catch(err => {
    console.error(err);
    alert("Failed to load item data");
  });

    // CLOSE POPUP
document.getElementById("closePopup").onclick = () => {
  document.getElementById("billingPopup").style.display = "none";
};


    /// PAYMENT
document.getElementById("continuePayment").onclick =
  async () => {

  try {

    let payload = {};

      if (type === "website") {

        payload = {
          client_id: 1, // temporary
          item_type: "website",
          website_id: id,
          selected_plan: "basic",
          email: "test@email.com"
        };

      } else if (type === "agent") {

        payload = {
          client_id: 1, // temporary
          item_type: "agent",
          agent_id: id,
          email: "test@email.com"
        };

      } else if (type === "system"){

        payload = {
          client_id: 1, // temporary
          item_type: "system",
          system_id: id,
          email: "test@email.com"
        };

      }


    const res = await fetch(
      "https://modular-infrastructure.onrender.com/api/pay",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      }
    );

    const result = await res.json();

    if (result?.data?.link) {

      window.location.href =
        result.data.link;

    } else {

      throw new Error();

    }

  } catch (err) {

    console.error(err);
    alert("Payment failed");

  }

};

  });
  </script>

</body>
</html>
