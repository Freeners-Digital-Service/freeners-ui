<!DOCTYPE html>
<html>
<head>
  <title>System Setup</title>

  <style>

    /* =========================
       PAGE
    ========================= */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* =========================
       POPUP
    ========================= */
    .setup-popup {
      width: 100%;
      max-width: 650px;
      background: white;
      color: #111;
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      overflow: hidden;
      animation: fadeIn 0.25s ease;
    }

    /* =========================
       HEADER
    ========================= */
    .setup-header {
      padding: 25px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .setup-header h1 {
      margin: 0;
      font-size: 26px;
      color: #111827;
    }

    .setup-header p {
      margin-top: 8px;
      color: #64748b;
      font-size: 14px;
    }

    /* =========================
       CONTENT
    ========================= */
    .setup-content {
      padding: 25px;
      max-height: 70vh;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    /* =========================
       LOADING BOX
    ========================= */
    .loading-box {
      text-align: center;
      padding: 40px 20px;
    }

    .loading-box h2 {
      margin-bottom: 10px;
      color: #111827;
    }

    .loading-box p {
      color: #64748b;
    }

    /* =========================
       FOOTER
    ========================= */
    .setup-footer {
      padding: 20px 25px;
      border-top: 1px solid #e2e8f0;
      background: #f8fafc;
      display: flex;
      justify-content: flex-end;
    }

    .footer-btn {
      background: #16a34a;
      color: white;
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .footer-btn:hover {
      background: #15803d;
    }

    /* =========================
       ANIMATION
    ========================= */
    @keyframes fadeIn {
      from {
        transform: scale(0.95);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }


    /* =========================
   DYNAMIC FORM
========================= */

.setup-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-label {
  margin-bottom: 8px;
  font-weight: bold;
  color: #111827;
}

.form-input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #cbd5e1;
  box-sizing: border-box;
  font-size: 14px;
}

.form-input:focus {
  outline: none;
  border-color: #16a34a;
}

.form-submit {
  width: 100%;
  padding: 14px;
  background: #16a34a;
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s ease;
}

.form-submit:hover {
  background: #15803d;
}


  </style>
</head>

<body>

  <!-- =========================
       SETUP POPUP
  ========================= -->
  <div class="setup-popup">

    <!-- HEADER -->
    <div class="setup-header">
      <h1>System Setup</h1>
      <p>
        Configure your purchased system before activation.
      </p>
    </div>

    <!-- CONTENT -->
    <div class="setup-content" id="setupContent">

      <div class="loading-box">
        <h2>Loading Setup Form...</h2>
        <p>Please wait while we prepare your configuration form.</p>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="setup-footer">
      <button class="footer-btn">
        Submit Configuration
      </button>
    </div>

  </div>

  <!-- =========================
       JS
  ========================= -->
  <script>

const params = new URLSearchParams(window.location.search);

const type = params.get("type") || "system";
const id = params.get("id");

const setupContent = document.getElementById("setupContent");

/* =========================
   LOAD FORM
========================= */

async function loadSetupForm() {

  try {

    const res = await fetch(
      `https://modular-infrastructure.onrender.com/api/setup/form/${type}`
    );

    const data = await res.json();

    if (!data.success) {
      throw new Error();
    }

    renderForm(data.form.fields);

  } catch (err) {

    setupContent.innerHTML = `
      <div class="loading-box">
        <h2>Failed to Load Form</h2>
        <p>Please refresh and try again.</p>
      </div>
    `;

  }

}

/* =========================
   RENDER FORM
========================= */

function renderForm(fields) {

  let html = `<form id="setupForm" class="setup-form">`;

  fields.forEach(field => {

    html += `
      <div class="form-group">

        <label class="form-label">
          ${field.label}
        </label>
    `;

    /* FILE INPUT */

    if (field.type === "file") {

      html += `
        <input
          type="file"
          name="${field.name}"
          class="form-input"
        />
      `;

    }

    /* NORMAL INPUT */

    else {

      html += `
        <input
          type="${field.type}"
          name="${field.name}"
          placeholder="${field.placeholder || ""}"
          class="form-input"
        />
      `;

    }

    html += `</div>`;

  });

  html += `
    <button
      type="submit"
      class="form-submit">
      Submit Configuration
    </button>
  `;

  html += `</form>`;

  setupContent.innerHTML = html;

}

/* =========================
   START
========================= */

loadSetupForm();

</script>


</body>
</html>
