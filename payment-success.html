<!DOCTYPE html>
<html>
<head>
  <title>Payment Verification</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      background: white;
      color: #111;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      text-align: center;
      animation: fadeIn 0.25s ease;
    }

    .status-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 24px;
      background: #16a34a;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: #15803d;
    }

    .retry-btn {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      background: #334155;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from {
        transform: scale(0.95);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

  </style>
</head>

<body>

<div id="app">

  <div class="box">
    <div class="status-icon">⏳</div>
    <h2>Verifying Payment...</h2>
    <p>Please wait while we confirm your transaction.</p>
  </div>

</div>

<script>

const params =
new URLSearchParams(
window.location.search
);

const transaction_id =
params.get("transaction_id");

const tx_ref =
params.get("tx_ref");

/* =========================
   EXTRACT TYPE + ID
========================= */

const item_type =
params.get("type")
|| "system";

const item_id =
tx_ref
? tx_ref.split("_")[1]
: null;

/* =========================
   PAGE CONTENT
========================= */

const isWebsite =
item_type === "website";

const itemName =
isWebsite
? "website"
: "system";

const setupType =
isWebsite
? "website"
: "system";

const setupButtonText =
isWebsite
? "Proceed to Website Setup"
: "Proceed to System Setup";

/* =========================
   MISSING PAYMENT INFO
========================= */

if (
!transaction_id ||
!tx_ref
) {

document.getElementById("app")
.innerHTML = `
<div class="box">

<div class="status-icon">
❌
</div>

<h2>
No Transaction Found
</h2>

<p>
Missing payment information.
</p>

</div>
`;

}

/* =========================
   CHECK PAYMENT STATUS
========================= */

else {

async function
checkPaymentStatus() {

try {

const res =
await fetch(
`https://modular-infrastructure.onrender.com/api/payment-status?tx_ref=${tx_ref}`
);

const data =
await res.json();

/* PAYMENT CONFIRMED */

if (
data.success &&
data.status === "paid"
) {

document.getElementById("app")
.innerHTML = `
<div class="box">

<div class="status-icon">
✅
</div>

<h2>
Payment Successful
</h2>

<p>
Your ${itemName}
purchase has been
confirmed successfully.

You can now continue
to fill your
${itemName}
information.
</p>

<a
class="btn"
href="https://freeners-ui-site.netlify.app/setup.html?type=${setupType}&id=${item_id}">
${setupButtonText}
</a>

</div>
`;

}

/* STILL WAITING */

else {

document.getElementById("app")
.innerHTML = `
<div class="box">

<div class="status-icon">
⏳
</div>

<h2>
Waiting for Payment Confirmation
</h2>

<p>
Please wait while we
confirm your payment.
</p>

</div>
`;

setTimeout(
checkPaymentStatus,
3000
);

}

} catch (err) {

document.getElementById("app")
.innerHTML = `
<div class="box">

<div class="status-icon">
⚠️
</div>

<h2>
Verification Error
</h2>

<p>
Failed to check
payment status.

Please try again
shortly.
</p>

</div>
`;

}

}

/* START CHECKING */

checkPaymentStatus();

}

</script>


</script>

</body>
</html>
